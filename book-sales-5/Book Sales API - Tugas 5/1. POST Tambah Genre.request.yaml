$kind: http-request
url: "{{base_url}}/api/genres"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Misteri",
      "description": "Genre yang berisi teka-teki dan penyelidikan."
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("genre_id", pm.response.json().data.id);
    language: text/javascript
order: 1000
