$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "customer2@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("customer2_token", pm.response.json().data.token);
    language: text/javascript
order: 2000
